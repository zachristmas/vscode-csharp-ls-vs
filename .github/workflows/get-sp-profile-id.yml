name: Get SP profile id

# One-off: prints the service principal's VS Marketplace profile id, which is the
# value to add as a publisher member ("User Id"). Uses the same federated OIDC creds.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  get-id:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Service principal Marketplace profile
        run: |
          az rest --method get \
            --url "https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1-preview.3" \
            --resource "499b84ac-1321-427f-aa17-267ca6975798" \
            -o json
